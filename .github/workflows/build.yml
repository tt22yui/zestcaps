name: Build

on:
  workflow_dispatch:            # 手动触发：仅构建并上传产物，不创建 Release
  push:
    tags:
      - 'v*'                    # 推送 v* 标签时自动发布正式版（Release 步骤仅在 tag 时执行）

# 同一 ref 的构建互斥：避免「手动触发」与「打标签」同时跑，两个 Release 互相覆盖
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20         # 兜底：卡死（如下载/编译挂起）时不至于占满 6 小时配额
    permissions:
      contents: write           # 允许创建 Release / 上传产物

    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 下载官方 Zip 解释器（供单测与编译使用）
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # 从 GitHub Releases CDN 直接下载官方便携 ZIP（不走 autohotkey.com，避开 Cloudflare 拦截）。
          # 版本升级时同步更新下方 URL 中的 2.0.26（须不低于 src\Main.ahk 的 #Requires）。
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.26/AutoHotkey_2.0.26.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ahk.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          # 校验下载包 SHA256（官方 Release 资产不可变，哈希固定），防止匿名下载被替换/损坏
          $expected = "43522aa3122a57784ac5db30abf85c2244475c36acd7796e2c993355f9e926ae"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          if ($actual -ne $expected) { throw "AutoHotkey ZIP 校验失败：期望 $expected，实际 $actual" }
          Write-Host "AutoHotkey ZIP SHA256 校验通过"
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "ahk") -Force
          $baseExe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "ahk") -Recurse -Filter "AutoHotkey64.exe" | Select-Object -First 1
          if (-not $baseExe) { throw "官方 Zip 未包含 AutoHotkey64.exe" }
          Write-Host "AHK_BASE=$($baseExe.FullName)"
          "AHK_BASE=$($baseExe.FullName)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: 全链路语法校验（编译门禁）
        shell: pwsh
        run: |
          # /validate 只做加载期校验、不执行脚本（不注册热键/托盘/定时器，无副作用），
          # 覆盖 src\Main.ahk 的完整 #Include 链：能拦住「某模块语法坏了但单测没引用到」的情况。
          # 入口按 #Warn All, StdOut 打开全量告警（实测当前全链路零告警），
          # 任何告警都会落到下方「有输出即失败」分支：拼错变量名、局部与全局同名、不可达代码等都能拦住。
          #
          # 调用方式必须用 Start-Process -Wait -PassThru：
          # AHK 是 GUI 子系统程序，在 PowerShell 7 上用 `& $exe` 调用时 $LASTEXITCODE 取不到值
          # （表现为「退出码=」为空、失败原因被误报成「校验失败」）——v0.3.4 首次发布即栽在这里，
          # 与仓库既有教训「用 & 调 AutoHotkey64.exe 拿不到退出码」是同一个坑。
          # 解析解释器：优先用上一步写入的 AHK_BASE，取不到就现场搜索便携 ZIP 解压目录（避免跨步骤耦合）
          $ahk = $env:AHK_BASE
          if (-not $ahk -or -not (Test-Path -LiteralPath $ahk)) {
            $found = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "ahk") -Recurse -Filter "AutoHotkey64.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $ahk = $found.FullName }
          }
          if (-not $ahk -or -not (Test-Path -LiteralPath $ahk)) {
            Write-Host "AHK_BASE=[$env:AHK_BASE]；在 $env:RUNNER_TEMP\ahk 下也未找到 AutoHotkey64.exe"
            Write-Host "无法执行语法校验"
            exit 1
          }
          Write-Host "解释器: $ahk"
          $vOut = Join-Path $env:RUNNER_TEMP "validate_out.log"
          $vErr = Join-Path $env:RUNNER_TEMP "validate_err.log"
          $p = Start-Process -FilePath $ahk -ArgumentList @("/validate", "/ErrorStdOut", "test\Load\validate_main.ahk") -Wait -PassThru -RedirectStandardOutput $vOut -RedirectStandardError $vErr
          $code = $p.ExitCode
          $text = ""
          if (Test-Path $vOut) { $text += (Get-Content $vOut -Raw) }
          if (Test-Path $vErr) { $text += (Get-Content $vErr -Raw) }
          $text = "$text".Trim()
          if ($text) { $text | ForEach-Object { Write-Host $_ } }
          Write-Host "语法校验退出码=$code"
          if ($null -eq $code) { Write-Host "未取到退出码（进程未正常启动？）"; exit 1 }
          if ($code -ne 0) { Write-Host "全链路语法校验失败，退出码=$code"; exit 1 }
          if ($text) { Write-Host "全链路语法校验有告警/错误输出（见上）"; exit 1 }
          Write-Host "全链路语法校验通过"

      - name: 运行聚合测试（失败则中止发布）
        shell: pwsh
        run: |
          # GUI 程序用 & 拿不到 $LASTEXITCODE，改用 Start-Process -PassThru 读退出码；
          # 同时把子进程 stdout 落文件再回显，否则失败时日志里只有一行退出码，看不到是哪个模块挂了
          $ahk = $env:AHK_BASE
          if (-not $ahk -or -not (Test-Path -LiteralPath $ahk)) {
            $found = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "ahk") -Recurse -Filter "AutoHotkey64.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $ahk = $found.FullName }
          }
          if (-not $ahk -or -not (Test-Path -LiteralPath $ahk)) { Write-Host "未找到 AutoHotkey64.exe"; exit 1 }
          $log = Join-Path $env:RUNNER_TEMP "unit_tests.log"
          $p = Start-Process -FilePath $ahk -ArgumentList "test\run_all_tests.ahk" -Wait -PassThru -RedirectStandardOutput $log
          $testExit = $p.ExitCode
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
          Write-Host "测试退出码=$testExit"
          if ($testExit -ne 0) {
            Write-Error "测试未全部通过，退出码=$testExit"
            exit $testExit
          }

      - name: 运行期加载检查（Load/冒烟，headless，失败则中止）
        shell: pwsh
        run: |
          # 执行各模块顶层代码，抓 /validate 抓不到的运行期加载错误（Gdip_Startup、托盘菜单初始化、热键注册等）
          $ahk = $env:AHK_BASE
          if (-not $ahk -or -not (Test-Path -LiteralPath $ahk)) {
            $found = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "ahk") -Recurse -Filter "AutoHotkey64.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $ahk = $found.FullName }
          }
          if (-not $ahk -or -not (Test-Path -LiteralPath $ahk)) { Write-Host "未找到 AutoHotkey64.exe"; exit 1 }
          $loadTests = @("test\Load\test_main_load.ahk", "test\Load\test_updater_load.ahk", "test\Load\test_compile_load.ahk")
          $fail = 0
          foreach ($t in $loadTests) {
            $log = Join-Path $env:RUNNER_TEMP ("load_" + [IO.Path]::GetFileNameWithoutExtension($t) + ".log")
            $p = Start-Process -FilePath $ahk -ArgumentList @("/ErrorStdOut", $t) -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
            Write-Host "==== $t (exit=$($p.ExitCode)) ===="
            if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
            if (Test-Path "$log.err") { Get-Content "$log.err" | ForEach-Object { Write-Host $_ } }
            if ($p.ExitCode -ne 0) { $fail++ }
          }
          if ($fail -ne 0) { Write-Error "运行期加载检查失败 $fail 项"; exit 1 }
          Write-Host "运行期加载检查通过"

      - name: GUI 回归测试（非阻塞；CI 桌面环境不稳定，结果仅供查看）
        shell: pwsh
        continue-on-error: true
        run: |
          # 窗口类集成测试需要可交互桌面，CI runner 上可能不稳定，故非阻塞（失败会在本步标红，但不影响发布）
          $ahk = $env:AHK_BASE
          if (-not $ahk -or -not (Test-Path -LiteralPath $ahk)) {
            $found = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "ahk") -Recurse -Filter "AutoHotkey64.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $ahk = $found.FullName }
          }
          if (-not $ahk -or -not (Test-Path -LiteralPath $ahk)) { Write-Host "未找到 AutoHotkey64.exe"; exit 1 }
          $log = Join-Path $env:RUNNER_TEMP "gui_tests.log"
          $p = Start-Process -FilePath $ahk -ArgumentList @("test\run_gui_tests.ahk") -Wait -PassThru -RedirectStandardOutput $log
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
          Write-Host "GUI 测试退出码=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "GUI 回归测试未全部通过，退出码=$($p.ExitCode)"; exit $p.ExitCode }

      - name: 上传单测报告（无论成败）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: test/**/junit_unit_*.xml
          if-no-files-found: warn

      - name: 确定版本号并校验一致性
        id: version
        shell: pwsh
        run: |
          # 版本号唯一来源是 src\Config\Config.ahk 的 APP_VERSION；tag 触发时额外校验 tag 与它一致，
          # 否则产物内版本号与 Release/tag 不符：客户端会把同一版本反复当成「有新版本」，陷入更新死循环
          # 版本解析与 build.bat 共用同一脚本（scripts\read-version.ps1），避免解析规则双份漂移
          $appVersion = (& pwsh -NoProfile -File "scripts\read-version.ps1").Trim()
          if (-not $appVersion) { throw "未能从 src\Config\Config.ahk 解析 APP_VERSION" }
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/*') {
            $tag = "${{ github.ref_name }}"
            $tagVersion = $tag -replace '^v', ''
            if ($tagVersion -ne $appVersion) {
              throw "tag 版本($tagVersion) 与 APP_VERSION($appVersion) 不一致：请先同步 src\Config\Config.ahk 再打标签"
            }
            $v = $appVersion
          }
          else {
            $v = $appVersion
            $tag = "v$v"
          }
          Write-Host "version=$v  tag=$tag"
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          "tag=$tag"   | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8

      - name: 提取 CHANGELOG 发布日志（作为 Release 正文）
        shell: pwsh
        env:
          VERS: ${{ steps.version.outputs.version }}
        run: |
          # 从 CHANGELOG.md 中按当前版本号提取对应段落（`## [<版本>] - ...` 到下一个 `## [`），
          # 写入 release_body.md，作为打标签发布时的 Release 正文。
          $v = $env:VERS
          $lines = Get-Content "CHANGELOG.md" -Encoding UTF8
          $headerRe = '^## \[\s*' + [regex]::Escape($v) + '\s*\]'
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $headerRe) { $start = $i; break }
          }
          if ($start -ge 0) {
            $end = $lines.Count
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^## \[') { $end = $i; break }
            }
            $body = ($lines[$start..($end - 1)] -join "`n").Trim()
          }
          else {
            # 不硬失败（避免临时发版被卡住），但显著提示：发布日志缺失会让 Release 正文退化
            Write-Host "::warning::未在 CHANGELOG.md 中检索到 [$v] 对应的发布日志，请补充后再打标签"
            $body = "> 未在 CHANGELOG.md 中检索到 [$v] 对应的发布日志，请补充后重新打标签。"
          }
          if ($body -eq "") { $body = "> 该版本暂无发布日志。" }
          # PowerShell 7 下 Set-Content -Encoding UTF8 输出无 BOM，可直接作为 GitHub 正文。
          Set-Content -Path "release_body.md" -Value $body -Encoding UTF8
          Write-Host "发布日志已提取，长度=$($body.Length)"

      - name: 确保输出目录存在
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "output" | Out-Null

      - name: 编译 exe（直接用官方 Zip 内的 Ahk2Exe，不依赖第三方 action）
        shell: pwsh
        run: |
          # 复用第 2 步下载的官方 Zip 内的 Compiler\Ahk2Exe.exe：
          # 第三方编译 action 会直接产出分发给用户的 exe，风险过高（且需把 GITHUB_TOKEN 交给外部代码）。
          #
          # 解析解释器（同上：不依赖跨步骤环境变量，取不到就现场搜索）
          $ahk = $env:AHK_BASE
          if (-not $ahk -or -not (Test-Path -LiteralPath $ahk)) {
            $found = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "ahk") -Recurse -Filter "AutoHotkey64.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $ahk = $found.FullName }
          }
          if (-not $ahk -or -not (Test-Path -LiteralPath $ahk)) { Write-Host "未找到 AutoHotkey64.exe"; exit 1 }
          $base = $ahk        # 编译用的 base 解释器（优先便携 ZIP 内的）
          $ahk2exe = ""
          $tried = @()
          # ① 解释器所在目录（便携 ZIP 若带 Compiler 则在此；注意：实测 2.0.26 便携 ZIP **不含**编译器，
          #    这一步只为将来 ZIP 布局变化兜底）
          $ahkRoot = Split-Path $ahk -Parent
          foreach ($c in @((Join-Path $ahkRoot "Compiler\Ahk2Exe.exe"), (Join-Path (Split-Path $ahkRoot -Parent) "Compiler\Ahk2Exe.exe"))) {
            $tried += $c
            if (-not $ahk2exe -and (Test-Path -LiteralPath $c)) { $ahk2exe = $c }
          }
          # ② 解压目录内递归找（任意布局）
          if (-not $ahk2exe) {
            $tried += "递归搜索 $env:RUNNER_TEMP\ahk\**\Ahk2Exe.exe"
            $f = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "ahk") -Recurse -Filter "Ahk2Exe.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { $ahk2exe = $f.FullName }
          }
          # ③ 运行器上可能已装 AutoHotkey（安装版默认带 Compiler 组件）
          if (-not $ahk2exe) {
            foreach ($c in @((Join-Path $env:ProgramFiles "AutoHotkey\Compiler\Ahk2Exe.exe"), (Join-Path ${env:ProgramFiles(x86)} "AutoHotkey\Compiler\Ahk2Exe.exe"))) {
              if (-not $c) { continue }
              $tried += $c
              if (-not $ahk2exe -and (Test-Path -LiteralPath $c)) { $ahk2exe = $c }
            }
          }
          # ④ 从官方 Release 下载 Ahk2Exe（安装版 UX\install-ahk2exe.ahk 用的就是这条路）。
          #    固定到具体版本并校验 SHA256：匿名下载 latest 无校验存在供应链风险。
          if (-not $ahk2exe) {
            $ProgressPreference = 'SilentlyContinue'
            $zipUrl = "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip"
            $zipSha = "c29b8c3a5124850d79fc9e66e2ca79677c377d7f31631ad3022ba159c5d9e3be"
            Write-Host "从官方 Release 获取 Ahk2Exe: $zipUrl"
            $zipPath = Join-Path $env:RUNNER_TEMP "Ahk2Exe.zip"
            $dst = Join-Path $env:RUNNER_TEMP "ahk2exe"
            try {
              Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLower()
              if ($actual -ne $zipSha) { throw "Ahk2Exe ZIP 校验失败：期望 $zipSha，实际 $actual" }
              Write-Host "Ahk2Exe ZIP SHA256 校验通过"
              Expand-Archive -Path $zipPath -DestinationPath $dst -Force
            } catch {
              Write-Host "Ahk2Exe 下载/校验/解压失败：$($_.Exception.Message)"
            }
            $tried += "递归搜索 $dst\**\Ahk2Exe.exe"
            $f = Get-ChildItem -Path $dst -Recurse -Filter "Ahk2Exe.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { $ahk2exe = $f.FullName }
          }
          if (-not $ahk2exe) {
            Write-Host "未找到 Ahk2Exe.exe，已尝试:"
            $tried | ForEach-Object { Write-Host "  $_" }
            Write-Host "提示：可先在本机用 build.bat 编译，或把官方 Ahk2Exe 放入仓库/自建 release 后更新本步骤的下载地址"
            exit 1
          }
          # 统一构建入口：调用仓库根 build.bat（与本地构建同一份逻辑，避免构建逻辑双份）。
          # build.bat 经 AHK_ROOT 找 Compiler\Ahk2Exe.exe 与 AutoHotkey64.exe（或 v2\AutoHotkey64.exe）；
          # 这里把已发现的 ahk2exe 放到 base 根下的 Compiler\，再设 AHK_ROOT 调用。
          $ahkRoot = Split-Path $base -Parent
          $compilerDir = Join-Path $ahkRoot "Compiler"
          New-Item -ItemType Directory -Force -Path $compilerDir | Out-Null
          Copy-Item -LiteralPath $ahk2exe -Destination (Join-Path $compilerDir "Ahk2Exe.exe") -Force
          $env:AHK_ROOT = $ahkRoot
          $env:GITHUB_ACTIONS = "true"
          Write-Host "调用 build.bat（AHK_ROOT=$ahkRoot）..."
          & cmd /c build.bat
          if ($LASTEXITCODE -ne 0) { Write-Host "build.bat 失败，退出码=$LASTEXITCODE"; exit $LASTEXITCODE }
          $out = "output\zestcaps_v${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $out)) { Write-Host "编译未生成产物: $out"; exit 1 }
          Write-Host "编译完成: $out"

      - name: 校验产物存在
        shell: pwsh
        run: |
          $exe = "output\zestcaps_v${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $exe)) { throw "产物未生成: $exe" }
          Write-Host "产物已生成: $exe"

      - name: 生成 SHA256 校验值
        shell: pwsh
        run: |
          $exe = "output\zestcaps_v${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLower()
          $shaFile = "$exe.sha256"
          "$hash  $([System.IO.Path]::GetFileName($exe))" | Out-File -FilePath $shaFile -Encoding ascii
          Write-Host "已生成: $shaFile"

      - name: 上传构建产物（供手动触发时下载）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zestcaps-exe
          path: output/zestcaps_v${{ steps.version.outputs.version }}.exe
          if-no-files-found: warn

      - name: 发布到 GitHub Releases（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ZestCaps v${{ steps.version.outputs.version }}
          files: |
            output/zestcaps_v${{ steps.version.outputs.version }}.exe
            output/zestcaps_v${{ steps.version.outputs.version }}.exe.sha256
          body_path: release_body.md   # 使用 CHANGELOG 中对应版本的发布日志作为正文
          draft: false           # 打标签直接正式发布（不再先存草稿）
